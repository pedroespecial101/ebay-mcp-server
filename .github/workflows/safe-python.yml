name: Safe Python tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  credentials-and-defaults:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - name: Run non-mutating credentials and defaults tests
        run: python -m pytest -q tests/test_credentials_and_defaults.py
